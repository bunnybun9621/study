<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSAT STUDY DASHBOARD</title>

<style>
:root{
  --bg:#f5f4f8;
  --card:#fff;
  --text:#25232b;
  --muted:#92909a;
  --line:#eceaf0;
  --accent:#7c63d8;
  --soft:#f0ecff;
  --shadow:0 10px 35px rgba(35,30,55,.07);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,
  "Pretendard","Noto Sans KR",sans-serif;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:min(1500px,96vw);
  height:100vh;
  min-height:720px;
  margin:auto;
  padding:18px 0;

  display:grid;
  grid-template-rows:auto 1fr;
  gap:14px;
}

/* =========================
   상단
========================= */

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand h1{
  font-size:21px;
  margin:0;
  font-weight:850;
  letter-spacing:-.5px;
}

.brand p{
  margin:3px 0 0;
  color:var(--muted);
  font-size:12px;
}

.dday{
  display:flex;
  align-items:center;
  gap:14px;
  background:var(--card);
  padding:10px 16px;
  border-radius:16px;
  box-shadow:var(--shadow);
}

.dday .label{
  font-size:11px;
  color:var(--muted);
}

.dday strong{
  font-size:28px;
  line-height:1;
}

.dday small{
  font-size:11px;
  color:var(--muted);
}

/* =========================
   전체 레이아웃
========================= */

.layout{
  min-height:0;

  display:grid;

  /*
    왼쪽 = 타이머
    가운데 = 타임라인
    오른쪽 = 캘린더
  */
  grid-template-columns:
    310px
    minmax(380px,1fr)
    410px;

  gap:14px;
}

.col{
  min-height:0;

  display:flex;
  flex-direction:column;

  gap:14px;
}

.card{
  background:var(--card);
  border-radius:20px;
  box-shadow:var(--shadow);
  padding:16px;
  min-height:0;
}

.card h2{
  font-size:15px;
  margin:0 0 12px;
}

/* =========================
   타이머
========================= */

.timer-card{
  flex:0 0 auto;
  text-align:center;
}

.subject{
  width:100%;

  border:1px solid var(--line);
  background:#fafafd;

  border-radius:10px;

  padding:9px;

  margin-bottom:9px;
}

.timer{
  font-size:48px;
  font-weight:850;
  letter-spacing:1px;

  margin:10px 0 12px;
}

.timer-btns{
  display:flex;
  gap:7px;
  justify-content:center;
}

.timer-btns button,
.primary{
  border:0;
  border-radius:10px;
  padding:9px 14px;
}

.start{
  background:#24222a;
  color:#fff;
}

.reset{
  background:#eeeef2;
  color:#444;
}

.timer-note{
  font-size:10px;
  color:var(--muted);

  margin-top:8px;
}

/* =========================
   공부시간 통계
========================= */

.stats{
  flex:1;
  overflow:auto;
}

.stat-total{
  font-size:27px;
  font-weight:850;
  margin-bottom:10px;
}

.subject-row{
  margin:9px 0;
}

.subject-head{
  display:flex;
  justify-content:space-between;

  font-size:11px;

  margin-bottom:4px;
}

.bar{
  height:6px;

  background:#eeeef2;

  border-radius:99px;

  overflow:hidden;
}

.bar i{
  display:block;

  height:100%;

  background:#8a73df;

  border-radius:99px;
}

/* =========================
   타임라인
========================= */

.timeline-card{
  flex:1;

  display:flex;
  flex-direction:column;

  min-height:0;
}

.timeline-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.date-big{
  font-size:15px;
  font-weight:850;
}

.date-big small{
  font-size:10px;
  color:var(--muted);
  font-weight:500;
}

.timeline{
  position:relative;

  flex:1;

  min-height:0;

  overflow:auto;

  padding:5px 0 0;
}

.timeline-row{
  display:grid;

  grid-template-columns:52px 1fr;

  min-height:54px;

  border-bottom:1px solid #f1eff3;
}

.t-label{
  font-size:9px;
  color:#aaa;

  padding-top:7px;
}

.track{
  position:relative;

  background:
    repeating-linear-gradient(
      to right,
      transparent 0,
      transparent calc(4.166% - 1px),
      #f4f2f6 calc(4.166% - 1px),
      #f4f2f6 4.166%
    );
}

.session{
  position:absolute;

  top:10px;

  height:34px;

  border-radius:7px;

  padding:4px 6px;

  font-size:9px;

  overflow:hidden;

  white-space:nowrap;

  text-overflow:ellipsis;

  background:#8a73df;

  color:#fff;

  box-shadow:
    0 3px 8px rgba(70,50,120,.12);
}

.empty-timeline{
  display:flex;

  align-items:center;
  justify-content:center;

  height:100%;

  color:#aaa;

  font-size:12px;
}

/* =========================
   캘린더
========================= */

.month-card{
  display:flex;
  flex-direction:column;

  min-height:0;

  flex:1;
}

.cal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-bottom:10px;
}

.cal-head button{
  width:30px;
  height:30px;

  border:0;

  border-radius:9px;

  background:#f0eff3;
}

.month{
  font-weight:800;
  font-size:15px;
}

.week{
  display:grid;

  grid-template-columns:
    repeat(7,1fr);

  font-size:10px;

  color:#aaa;

  text-align:center;

  margin-bottom:4px;
}

.calendar{
  display:grid;

  grid-template-columns:
    repeat(7,1fr);

  grid-auto-rows:
    minmax(62px,1fr);

  min-height:0;

  flex:1;
}

.day{
  border:1px solid #f1eff3;

  padding:5px;

  position:relative;

  cursor:pointer;

  overflow:hidden;
}

.day:hover{
  background:#faf9fd;
}

.day.empty{
  background:#fbfafc;

  cursor:default;
}

.day-num{
  font-size:11px;
}

.day.today .day-num{
  display:inline-flex;

  width:22px;
  height:22px;

  align-items:center;
  justify-content:center;

  border-radius:50%;

  background:#25232b;

  color:#fff;
}

.day.selected{
  box-shadow:
    inset 0 0 0 2px #8a73df;
}

.day .mini{
  display:block;

  margin-top:4px;

  font-size:8px;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

  background:#f0ecff;

  color:#684fbc;

  padding:3px 4px;

  border-radius:5px;
}

.day .mini.dday{
  background:#25232b;

  color:#fff;
}

.day .study-min{
  position:absolute;

  right:4px;
  bottom:4px;

  font-size:8px;

  color:#888;
}

/* =========================
   할 일
========================= */

.tasks-card{
  display:flex;
  flex-direction:column;

  min-height:0;

  flex:1;
}

.selected-title{
  font-weight:800;

  font-size:13px;
}

.task-form{
  display:flex;

  gap:6px;

  margin-bottom:8px;
}

.task-form input{
  flex:1;

  min-width:0;

  border:1px solid var(--line);

  border-radius:9px;

  padding:8px;
}

.task-form button,
.small-btn{
  background:#25232b;

  color:#fff;

  border:0;

  border-radius:9px;

  padding:8px 10px;

  font-size:11px;
}

.task-list{
  overflow:auto;

  min-height:60px;
}

.task{
  display:flex;

  align-items:center;

  gap:7px;

  padding:7px 0;

  border-bottom:1px solid var(--line);

  font-size:11px;
}

.task label{
  flex:1;
}

.done{
  text-decoration:line-through;

  color:#aaa;
}

.x{
  background:none;

  border:0;

  color:#aaa;

  font-size:16px;
}

/* =========================
   요일별 반복 할 일
========================= */

.weekly{
  margin-top:10px;

  border-top:1px solid var(--line);

  padding-top:10px;
}

.weekly-title{
  display:flex;

  justify-content:space-between;

  align-items:center;

  font-size:11px;

  font-weight:800;

  margin-bottom:7px;
}

.week-pills{
  display:grid;

  grid-template-columns:
    repeat(7,1fr);

  gap:4px;
}

.week-pills button{
  border:1px solid var(--line);

  background:#fafafd;

  border-radius:7px;

  padding:6px 0;

  font-size:9px;
}

.week-pills button.active{
  background:#25232b;

  color:#fff;
}

.weekly-form{
  display:flex;

  gap:5px;

  margin-top:7px;
}

.weekly-form input{
  flex:1;

  border:1px solid var(--line);

  border-radius:8px;

  padding:7px;

  font-size:10px;
}

.weekly-form button{
  border:0;

  border-radius:8px;

  background:#8a73df;

  color:#fff;

  padding:7px 9px;

  font-size:10px;
}

.week-items{
  max-height:100px;

  overflow:auto;

  margin-top:5px;
}

.week-item{
  display:flex;

  justify-content:space-between;

  font-size:10px;

  padding:5px 0;
}

/* =========================
   D-Day
========================= */

.ddays{
  flex:0 0 auto;
}

.dday-list{
  max-height:150px;

  overflow:auto;
}

.dday-item{
  display:flex;

  justify-content:space-between;

  align-items:center;

  padding:8px 0;

  border-bottom:1px solid var(--line);

  font-size:11px;
}

.dday-item b{
  font-size:13px;
}

.add-dday{
  display:grid;

  grid-template-columns:
    1fr 115px auto;

  gap:5px;

  margin-top:8px;
}

.add-dday input{
  border:1px solid var(--line);

  border-radius:8px;

  padding:7px;

  font-size:10px;
}

.add-dday button{
  border:0;

  border-radius:8px;

  background:#25232b;

  color:#fff;

  font-size:10px;

  padding:0 10px;
}

.footer-note{
  font-size:9px;

  color:#aaa;

  text-align:center;
}

/* =========================
   모바일
========================= */

@media(max-width:1100px){

  .app{
    height:auto;

    min-height:100vh;
  }

  .layout{
    grid-template-columns:
      1fr 1fr;
  }

  .col:nth-child(2){
    grid-column:1 / -1;

    grid-row:2;
  }

  .col:nth-child(3){
    grid-column:2;

    grid-row:1;
  }

  .timeline-card{
    min-height:430px;
  }
}

@media(max-width:720px){

  .topbar{
    align-items:flex-start;

    gap:10px;
  }

  .dday{
    padding:9px;
  }

  .dday strong{
    font-size:22px;
  }

  .layout{
    display:flex;

    flex-direction:column;
  }

  .col{
    min-height:auto;
  }

  .calendar{
    grid-auto-rows:58px;
  }

  .month-card{
    min-height:420px;
  }

  .timeline-card{
    min-height:430px;
  }
}
</style>
</head>


<body>

<div class="app">

<!-- =========================
     상단
========================= -->

<header class="topbar">

  <div class="brand">

    <h1>
      STUDY DASHBOARD
    </h1>

    <p>
      수능까지 오늘도 한 칸씩.
    </p>

  </div>


  <div class="dday">

    <div>

      <div class="label">
        2027학년도 대학수학능력시험
      </div>

      <small>
        2026.11.19
      </small>

    </div>

    <strong id="csat">
      D-
    </strong>

  </div>

</header>


<!-- =========================
     메인
========================= -->

<main class="layout">


<!-- =========================
     LEFT
     타이머 + 통계
========================= -->

<section class="col">


  <!-- 타이머 -->

  <div
    class="card timer-card"
    id="timerCard"
  >

    <h2>
      공부 타이머
    </h2>


    <select
      class="subject"
      id="subject"
    >

      <option>
        국어
      </option>

      <option>
        수학
      </option>

      <option>
        영어
      </option>

      <option>
        탐구
      </option>

      <option>
        기타
      </option>

    </select>


    <div
      class="timer"
      id="timer"
    >
      00:00:00
    </div>


    <div class="timer-btns">

      <button
        class="start"
        id="startBtn"
        onclick="toggleTimer()"
      >
        시작
      </button>

      <button
        class="reset"
        onclick="resetCurrentTimer()"
      >
        리셋
      </button>

    </div>


    <div class="timer-note">

      중지는 시간을 기록만 하고
      0으로 돌아가지 않아요.<br>

      리셋을 눌러야 현재 타이머가
      초기화됩니다.

    </div>

  </div>


  <!-- 공부시간 -->

  <div class="card stats">

    <h2>
      오늘 공부 시간
    </h2>


    <div
      class="stat-total"
      id="todayTotal"
    >
      0시간 0분
    </div>


    <div id="todayStats"></div>


    <hr
      style="
      border:0;
      border-top:1px solid var(--line);
      margin:14px 0;
      "
    >


    <h2>
      수능까지 누적
    </h2>


    <div
      class="stat-total"
      id="allTotal"
    >
      0시간 0분
    </div>


    <div id="allStats"></div>

  </div>

</section>


<!-- =========================
     CENTER
     타임라인
========================= -->

<section class="col">

  <div
    class="card timeline-card"
  >

    <div class="timeline-head">

      <div
        class="date-big"
        id="timelineDate"
      >
        오늘
        <small></small>
      </div>


      <button
        class="small-btn"
        onclick="selectToday()"
      >
        오늘로
      </button>

    </div>


    <div
      class="timeline"
      id="timeline"
    ></div>

  </div>

</section>


<!-- =========================
     RIGHT
     캘린더 + 일정
========================= -->

<section class="col">


  <!-- 달력 -->

  <div class="card month-card">

    <div class="cal-head">

      <button
        onclick="moveMonth(-1)"
      >
        ‹
      </button>


      <div
        class="month"
        id="monthTitle"
      ></div>


      <button
        onclick="moveMonth(1)"
      >
        ›
      </button>

    </div>


    <div class="week">

      <span>일</span>
      <span>월</span>
      <span>화</span>
      <span>수</span>
      <span>목</span>
      <span>금</span>
      <span>토</span>

    </div>


    <div
      class="calendar"
      id="calendar"
    ></div>

  </div>


  <!-- 할 일 -->

  <div class="card tasks-card">

    <div
      class="selected-title"
      id="selectedTitle"
    ></div>


    <div class="task-form">

      <input
        id="taskInput"
        placeholder="이 날짜에 할 일 추가"
      >

      <button
        onclick="addDateTask()"
      >
        추가
      </button>

    </div>


    <div
      class="task-list"
      id="taskList"
    ></div>


    <!-- 반복 일정 -->

    <div class="weekly">

      <div class="weekly-title">

        <span>
          요일별 반복 할 일
        </span>

        <span
          style="
          color:#aaa;
          font-weight:500
          "
        >
          선택 날짜에 자동 표시
        </span>

      </div>


      <div
        class="week-pills"
        id="weekPills"
      ></div>


      <div class="weekly-form">

        <input
          id="weeklyInput"
          placeholder="예: 영어 단어 100개"
        >

        <button
          onclick="addWeeklyTask()"
        >
          요일에 추가
        </button>

      </div>


      <div
        class="week-items"
        id="weekItems"
      ></div>

    </div>

  </div>


  <!-- 나의 D-Day -->

  <div class="card ddays">

    <h2>
      나의 D-Day
    </h2>


    <div
      class="dday-list"
      id="ddayList"
    ></div>


    <div class="add-dday">

      <input
        id="ddayName"
        placeholder="예: 9월 모의고사"
      >

      <input
        id="ddayDate"
        type="date"
      >

      <button
        onclick="addDday()"
      >
        추가
      </button>

    </div>

  </div>


  <div class="footer-note">

    모든 기록은 이 브라우저의
    저장공간에 자동 저장됩니다.

  </div>

</section>

</main>

</div>


<script>

/* =========================
   기본 설정
========================= */

const CSAT =
  "2026-11-19";


const SUBJECTS = [
  "국어",
  "수학",
  "영어",
  "탐구",
  "기타"
];


const MONTHS = [
  8,
  9,
  10,
  11
];


const DAY_NAMES = [
  "일",
  "월",
  "화",
  "수",
  "목",
  "금",
  "토"
];


let selected =
  key(new Date());


let calDate =
  new Date(
    2026,
    new Date().getMonth() >= 8 &&
    new Date().getMonth() <= 11
      ? new Date().getMonth()
      : 8,
    1
  );


if(
  !MONTHS.includes(
    calDate.getMonth()
  )
){
  calDate =
    new Date(2026,8,1);
}


let weeklyDay =
  new Date().getDay();


/* =========================
   데이터
========================= */

let dateTasks =
  JSON.parse(
    localStorage.getItem(
      "csat_dateTasks"
    ) || "{}"
  );


let weeklyTasks =
  JSON.parse(
    localStorage.getItem(
      "csat_weeklyTasks"
    ) ||
    '{"0":[],"1":[],"2":[],"3":[],"4":[],"5":[],"6":[]}'
  );


let ddays =
  JSON.parse(
    localStorage.getItem(
      "csat_ddays"
    ) || "[]"
  );


let records =
  JSON.parse(
    localStorage.getItem(
      "csat_records"
    ) || "{}"
  );


/* =========================
   타이머 상태
========================= */

let running =
  false;

let currentSeconds =
  0;

let timerId =
  null;

let startedAt =
  null;

let activeSubject =
  "국어";


/* =========================
   저장
========================= */

function save(){

  localStorage.setItem(
    "csat_dateTasks",
    JSON.stringify(dateTasks)
  );

  localStorage.setItem(
    "csat_weeklyTasks",
    JSON.stringify(weeklyTasks)
  );

  localStorage.setItem(
    "csat_ddays",
    JSON.stringify(ddays)
  );

  localStorage.setItem(
    "csat_records",
    JSON.stringify(records)
  );

}


/* =========================
   날짜
========================= */

function key(d){

  return d
    .toISOString()
    .slice(0,10);

}


function todayKey(){

  return key(
    new Date()
  );

}


function diffDays(a,b){

  return Math.ceil(
    (
      new Date(a) -
      new Date(b)
    ) / 86400000
  );

}


/* =========================
   시간 포맷
========================= */

function fmt(sec){

  sec =
    Math.max(
      0,
      Math.floor(sec)
    );


  return `
    ${Math.floor(sec / 3600)}시간
    ${Math.floor((sec % 3600) / 60)}분
  `;

}


function fmtClock(sec){

  return [
    Math.floor(sec / 3600),

    Math.floor(
      (sec % 3600) / 60
    ),

    sec % 60

  ]

  .map(
    x =>
      String(x)
      .padStart(2,"0")
  )

  .join(":");

}


/* =========================
   수능 D-Day
========================= */

function updateCsat(){

  const d =
    diffDays(
      CSAT,
      todayKey()
    );


  document.getElementById(
    "csat"
  ).textContent =

    d > 0
      ? `D-${d}`
      : d === 0
      ? "D-DAY"
      : `D+${Math.abs(d)}`;

}


/* =========================
   달력
========================= */

function renderCalendar(){

  const y =
    calDate.getFullYear();

  const m =
    calDate.getMonth();


  document.getElementById(
    "monthTitle"
  ).textContent =
    `${y}년 ${m+1}월`;


  const el =
    document.getElementById(
      "calendar"
    );


  el.innerHTML = "";


  const first =
    new Date(
      y,
      m,
      1
    ).getDay();


  const last =
    new Date(
      y,
      m + 1,
      0
    ).getDate();


  /* 빈 칸 */

  for(
    let i=0;
    i<first;
    i++
  ){

    const x =
      document.createElement(
        "div"
      );

    x.className =
      "day empty";

    el.appendChild(x);

  }


  /* 날짜 */

  for(
    let d=1;
    d<=last;
    d++
  ){

    const dt =
      new Date(
        y,
        m,
        d
      );


    const k =
      key(dt);


    const x =
      document.createElement(
        "div"
      );


    x.className =
      "day";


    if(
      k === todayKey()
    ){
      x.classList.add(
        "today"
      );
    }


    if(
      k === selected
    ){
      x.classList.add(
        "selected"
      );
    }


    x.innerHTML =
      `<span class="day-num">
        ${d}
      </span>`;


    /* 수능 */

    if(
      k === CSAT
    ){

      x.innerHTML +=
        `
        <span class="mini dday">
          수능 D-DAY
        </span>
        `;

    }


    /* 일정 */

    (
      dateTasks[k] || []
    )
    .slice(0,2)
    .forEach(t => {

      x.innerHTML +=
        `
        <span class="mini">
          ${esc(t.text)}
        </span>
        `;

    });


    /* 공부 시간 */

    const study =
      totalForDay(k);


    if(
      study > 0
    ){

      x.innerHTML +=
        `
        <span class="study-min">
          ${Math.floor(study/60)}분
        </span>
        `;

    }


    x.onclick =
      () => {

        selected =
          k;

        renderAll();

      };


    el.appendChild(x);

  }

}


/* =========================
   월 이동
========================= */

function moveMonth(n){

  let next =
    calDate.getMonth() + n;


  if(next < 8)
    next = 8;


  if(next > 11)
    next = 11;


  calDate =
    new Date(
      2026,
      next,
      1
    );


  renderCalendar();

}


/* =========================
   오늘
========================= */

function selectToday(){

  selected =
    todayKey();


  calDate =
    new Date(
      new Date().getFullYear(),
      new Date().getMonth(),
      1
    );


  if(
    !MONTHS.includes(
      calDate.getMonth()
    )
  ){

    calDate =
      new Date(
        2026,
        8,
        1
      );

  }


  renderAll();

}


/* =========================
   날짜별 할 일
========================= */

function renderTasks(){

  const dt =
    new Date(
      selected +
      "T00:00:00"
    );


  const day =
    dt.getDay();


  document.getElementById(
    "selectedTitle"
  ).textContent =
    `${selected.replaceAll("-",".")}
     · ${DAY_NAMES[day]}요일`;


  const list =
    document.getElementById(
      "taskList"
    );


  list.innerHTML = "";


  /* 반복 일정 */

  const recurring =
    (
      weeklyTasks[day] || []
    )
    .map(
      (t,i) => ({
        ...t,
        recurring:true,
        ri:i
      })
    );


  /* 해당 날짜 일정 */

  const specific =
    dateTasks[selected] || [];


  if(
    !recurring.length &&
    !specific.length
  ){

    list.innerHTML =
      `
      <div
        style="
        color:#aaa;
        font-size:11px;
        padding:8px 0
        "
      >
        등록된 할 일이 없어요.
      </div>
      `;

  }


  recurring.forEach(
    t =>
      addTaskEl(
        list,
        t,
        t.ri,
        true
      )
  );


  specific.forEach(
    (t,i) =>
      addTaskEl(
        list,
        t,
        i,
        false
      )
  );


  renderWeekly(day);

}


/* =========================
   할 일 UI
========================= */

function addTaskEl(
  list,
  t,
  i,
  isWeekly
){

  const row =
    document.createElement(
      "div"
    );


  row.className =
    "task";


  row.innerHTML =
    `
    <input
      type="checkbox"
      ${t.done ? "checked" : ""}
    >

    <label
      class="${t.done ? "done" : ""}"
    >
      ${esc(t.text)}

      ${
        isWeekly
          ? '<span style="color:#aaa">(반복)</span>'
          : ''
      }

    </label>

    <button class="x">
      ×
    </button>
    `;


  row
    .querySelector("input")
    .onchange =
      () => {

        t.done =
          !t.done;

        save();

        renderTasks();

      };


  row
    .querySelector(".x")
    .onclick =
      () => {

        if(isWeekly){

          weeklyTasks[
            new Date(
              selected +
              "T00:00:00"
            ).getDay()
          ].splice(
            i,
            1
          );

        }else{

          dateTasks[
            selected
          ].splice(
            i,
            1
          );

        }


        save();

        renderAll();

      };


  list.appendChild(row);

}


/* =========================
   날짜 일정 추가
========================= */

function addDateTask(){

  const inp =
    document.getElementById(
      "taskInput"
    );


  const text =
    inp.value.trim();


  if(!text)

  (

/* =========================
   요일별 일정
========================= */

function renderWeekly(day){

  const p =
    document.getElementById(
      "weekPills"
    );


  p.innerHTML = "";


  DAY_NAMES.forEach(
    (n,i) => {

      const b =
        document.createElement(
          "button"
        );


      b.textContent =

      b.className =

          : "";

        };

    }

    document.getElementById(
      "weekItems"
    );


  box.innerHTML = "";


  (
    weeklyTasks[weeklyDay] || []
  )
  .forEach(
    (t,i) => {

      const r =
        document.createElement(
          "div"
        );


      r.className =
        "week-item";


      r.innerHTML =
        `
        <span>
          • ${esc(t.text)}
        </span>

        <button
          class="x"
          style="font-size:13px"
        >
          ×
        </button>
        `;


      r
        .querySelector("button")
        .onclick =
          () => {

            weeklyTasks[
              weeklyDay
            ].splice(
              i,
              1
            );


            save();

            renderAll();

          };


      box.appendChild(r);

    }
  );

/* =========================
   요일 반복 일정 추가
========================= */

function addWeeklyTask(){

      "weeklyInput"
    );


  const text =

  });

/* =========================
   타이머
========================= */

function toggleTimer(){

  if(running){

    /* 중지 */

    running =
      false;


    clearInterval(
      timerId
    );


    const end =
      new Date();


    saveSession(
      startedAt,
      end,
      activeSubject
    );


    document.getElementById(
      "startBtn"
    ).textContent =
      "시작";


  }else{

    /* 시작 */

    activeSubject =
      document.getElementById(
        "subject"
      ).value;


    startedAt =
      new Date(
        Date.now() -
        currentSeconds * 1000
      );


    running =
      true;


    document.getElementById(
      "startBtn"
    ).textContent =
      "중지";


    timerId =
      setInterval(
        () => {

          currentSeconds++;


          document.getElementById(
            "timer"
          ).textContent =
            fmtClock(
              currentSeconds
            );

        },
        1000
      );

  }

}


/* =========================
   공부 기록 저장
========================= */

function saveSession(
  start,
  end,
  subject
){

  const duration =
    Math.max(
      1,
      Math.round(
        (end - start) / 1000
      )
    );


  const day =
    key(start);


  (
    records[day] ??
    (records[day] = [])
  )
  .push({

    start:
      start.toISOString(),

    end:
      end.toISOString(),

    duration,

    subject

  });


  save();


  renderAll();

}


/* =========================
   현재 타이머 리셋
========================= */

function resetCurrentTimer(){

  /*
    실행 중이었다면
    먼저 지금까지 시간을 저장
  */

  if(running){

    running =
      false;


    clearInterval(
      timerId
    );


    saveSession(
      startedAt,
      new Date(),
      activeSubject
    );


    document.getElementById(
      "startBtn"
    ).textContent =
      "시작";

  }


  currentSeconds =
    0;


  document.getElementById(
    "timer"
  ).textContent =
    "00:00:00";

}


/* =========================
   전체 공부 기록
========================= */

function allSessions(){

  return Object
    .values(records)
    .flat();

}


function totalForDay(k){

  return (
    records[k] || []
  )
  .reduce(
    (s,x) =>
      s + x.duration,
    0
  );

}


/* =========================
   과목별 시간
========================= */

function subjectTotals(
  dayKey=null
){

  const out =
    Object.fromEntries(
      SUBJECTS.map(
        s => [s,0]
      )
    );


  const arr =
    dayKey
      ? records[dayKey] || []
      : allSessions();


  arr.forEach(
    x => {

      out[x.subject] =
        (out[x.subject] || 0)
        + x.duration;

    }
  );


  return out;

}


/* =========================
   통계 렌더링
========================= */

function renderStats(){

  const today =
    subjectTotals(
      todayKey()
    );


  const all =
    subjectTotals();


  const tt =
    Object
      .values(today)
      .reduce(
        (a,b) => a+b,
        0
      );


  const at =
    Object
      .values(all)
      .reduce(
        (a,b) => a+b,
        0
      );


  document.getElementById(
    "todayTotal"
  ).textContent =
    fmt(tt);


  document.getElementById(
    "allTotal"
  ).textContent =
    fmt(at);


  renderBars(
    "todayStats",
    today,
    tt
  );


  renderBars(
    "allStats",
    all,
    at
  );

}


/* =========================
   과목 그래프
========================= */

function renderBars(
  id,
  data,
  total
){

  const el =
    document.getElementById(id);


  el.innerHTML = "";


  SUBJECTS.forEach(
    s => {

      const v =
        data[s] || 0;


      const p =
        total
          ? v / total * 100
          : 0;


      el.innerHTML +=
        `
        <div class="subject-row">

          <div class="subject-head">

            <span>
              ${s}
            </span>

            <span>
              ${fmt(v)}
            </span>

          </div>


          <div class="bar">

            <i
              style="
              width:${p}%
              "
            ></i>

          </div>

        </div>
        `;

    }
  );

}


/* =========================
   하루 타임라인
========================= */

function renderTimeline(){

  const day =
    selected;


  const arr =
    (
      records[day] || []
    )
    .slice()
    .sort(
      (a,b) =>
        new Date(a.start) -
        new Date(b.start)
    );


  document.getElementById(
    "timelineDate"
  ).innerHTML =
    `
    ${day.replaceAll("-",".")}
    <small>
      ${day === todayKey()
        ? "오늘"
        : ""}
    </small>
    `;


  const el =
    document.getElementById(
      "timeline"
    );


  el.innerHTML = "";


  if(!arr.length){

    el.innerHTML =
      `
      <div
        class="empty-timeline"
      >
        이 날짜의 공부 기록이
        아직 없어요.
      </div>
      `;

    return;

  }


  /*
    24시간 표시
  */

  for(
    let h=0;
    h<24;
    h++
  ){

    const row =
      document.createElement(
        "div"
      );


    row.className =
      "timeline-row";


    row.innerHTML =
      `
      <div class="t-label">
        ${String(h).padStart(2,"0")}:00
      </div>

      <div class="track"></div>
      `;


    const track =
      row.querySelector(
        ".track"
      );


    arr
      .filter(
        s => {

          const d =
            new Date(
              s.start
            );


          const e =
            new Date(
              s.end
            );


          return (
            d.getHours() === h ||

            (
              e.getHours() === h &&
              e.getDate() ===
              d.getDate()
            )
          );

        }
      )
      .forEach(
        s => {

          const st =
            new Date(
              s.start
            );


          const en =
            new Date(
              s.end
            );


          let startMin =
            st.getHours()*60 +
            st.getMinutes() +
            st.getSeconds()/60;


          let endMin =
            en.getHours()*60 +
            en.getMinutes() +
            en.getSeconds()/60;


          if(
            endMin <= startMin
          ){

            endMin =
              startMin +
              s.duration/60;

          }


          if(
            st.getHours() !== h
          ){

            startMin =
              h*60;

          }


          if(
            en.getHours() !== h
          ){

            endMin =
              (h+1)*60;

          }


          const block =
            document.createElement(
              "div"
            );


          block.className =
            "session";


          block.style.left =
            (
              (startMin-h*60)
              /60*100
            ) + "%";


          block.style.width =
            Math.max(
              .8,
              (endMin-startMin)
              /60*100
            ) + "%";


          block.textContent =
            `${s.subject} · ${fmtShort(
              s.duration
            )}`;


          track.appendChild(
            block
          );

        }
      );


    el.appendChild(
      row
    );

  }

}


/* =========================
   짧은 시간
========================= */

function fmtShort(s){

  return `
    ${Math.floor(s/60)}분
  `;

}


/* =========================
   나의 D-Day
========================= */

function renderDdys(){

  const el =
    document.getElementById(
      "ddayList"
    );


  el.innerHTML = "";


  const list = [

    {
      name:"수능",
      date:CSAT,
      locked:true
    },

    ...ddays

  ]
  .sort(
    (a,b) =>
      a.date.localeCompare(
        b.date
      )
  );


  list.forEach(
    d => {

      const n =
        diffDays(
          d.date,
          todayKey()
        );


      const row =
        document.createElement(
          "div"
        );


      row.className =
        "dday-item";


      row.innerHTML =
        `
        <span>

          ${esc(d.name)}

          <small
            style="
            color:#aaa
            "
          >
            ${d.date.replaceAll(
              "-",
              "."
            )}
          </small>

        </span>


        <b>

          ${
            n > 0
              ? "D-"+n
              : n === 0
              ? "D-DAY"
              : "D+"+
                Math.abs(n)
          }

        </b>


        ${
          d.locked
            ? ""
            : `
              <button
                class="x"
              >
                ×
              </button>
            `
        }

        `;


      if(!d.locked){

        row
          .querySelector(
            "button"
          )
          .onclick =
            () => {

              ddays.splice(
                ddays.indexOf(d),
                1
              );


              save();

              renderAll();

            };

      }


      el.appendChild(
        row
      );

    }
  );

}


/* =========================
   D-Day 추가
========================= */

function addDday(){

  const n =
    document.getElementById(
      "ddayName"
    );


  const d =
    document.getElementById(
      "ddayDate"
    );


  if(

    name:

    date:
      d.value

  });


  n.value = "";

  d.value = "";


  save();

  renderAll();

}


/* =========================
   HTML escape
========================= */

function esc(s){

  const d =
    document.createElement(
      "div"
    );


  d.textContent =
    s;


  return d.innerHTML;

}

========================= */

document

  )

updateCsat();

renderAll();
